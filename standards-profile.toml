schema_version = 1
profile_id = "web-static"
repository = "AI-Ascension/AI-Ascension.github.io"
owner = "ORG"
source_bundle = "AI-Ascension/.github"
source_commit = "ce4ca6dc4a202a276cf5387ae5c43011e3bbe88f"
source_digest = "sha256:af5c0138aff3356cb1bb520c90e61bfc68efc1f8d4fa6f436570e7e3b231190a"
distribution = "local"
scopes = [
    "html",
    "css",
    "javascript",
    "rust",
]

[checks]
fast = [
    "git-diff-check",
    "standards-validate",
    "npm-format-check",
    "npm-lint",
    "node-tests",
]
required = [
    "browser-check",
    "pinned-gateway-recipe",
    "pinned-mcp-recipe",
]
extended = []

[checks.commands.browser-check]
command = "npm run test:browser"
target = "."

[checks.commands.git-diff-check]
command = "git diff --check"
target = "."

[checks.commands.node-tests]
command = "node --test tests/*.test.cjs"
target = "."

[checks.commands.npm-format-check]
command = "npm run format:check"
target = "."

[checks.commands.npm-lint]
command = "npm run lint"
target = "."

[checks.commands.pinned-gateway-recipe]
command = "node ../../scripts/check-recipe.mjs"
target = "recipes/gateway-lease-fence"

[checks.commands.pinned-mcp-recipe]
command = "node ../../scripts/check-recipe.mjs"
target = "recipes/mcp-seam"

[checks.commands.standards-validate]
command = "cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root ."
target = "."

[evidence]
runtime = "unverified"
deployment = "unverified"
provider = "unverified"

[exceptions]
file = ""
status = "none"
